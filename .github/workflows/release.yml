name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.2.18"
      - run: bun install --frozen-lockfile
      - run: bun run build:dashboard
      - name: Publish (skipped if NPM_TOKEN is unset)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
      - name: Note when skipped
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not set — skipping npm publish. Add the secret to enable."
