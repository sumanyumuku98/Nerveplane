<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nerveplane">
  <defs>
    <linearGradient id="np-blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3fa9f4"/>
      <stop offset="1" stop-color="#6d7ff0"/>
    </linearGradient>
    <linearGradient id="np-violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7c6cf0"/>
      <stop offset="1" stop-color="#6a41d4"/>
    </linearGradient>
    <linearGradient id="np-orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5a23a"/>
      <stop offset="1" stop-color="#f2744f"/>
    </linearGradient>
    <linearGradient id="np-hub" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bd93f4"/>
      <stop offset="1" stop-color="#7b34cf"/>
    </linearGradient>
    <linearGradient id="np-edge" x1="40" y1="60" x2="216" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
    <linearGradient id="np-edge-warm" x1="128" y1="124" x2="198" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f2794f"/>
    </linearGradient>
  </defs>

  <!-- light rounded-square tile -->
  <rect x="1.5" y="1.5" width="253" height="253" rx="56" fill="#ffffff" stroke="#ececf0" stroke-width="3"/>

  <!-- routing edges: the hub fans a signal out to peripheral agent nodes -->
  <g stroke-width="6" stroke-linecap="round">
    <line x1="128" y1="124" x2="66"  y2="64"  stroke="url(#np-edge)"/>
    <line x1="128" y1="124" x2="214" y2="126" stroke="url(#np-edge)"/>
    <line x1="128" y1="124" x2="64"  y2="192" stroke="url(#np-edge)"/>
    <line x1="128" y1="124" x2="202" y2="192" stroke="url(#np-edge)"/>
    <line x1="128" y1="124" x2="198" y2="62"  stroke="url(#np-edge-warm)"/>
  </g>

  <!-- peripheral nodes (agents / repos / services) as hollow rings -->
  <g fill="none" stroke-width="8">
    <circle cx="66"  cy="64"  r="17" stroke="url(#np-blue)"/>
    <circle cx="214" cy="126" r="17" stroke="url(#np-blue)"/>
    <circle cx="64"  cy="192" r="17" stroke="url(#np-blue)"/>
    <circle cx="202" cy="192" r="17" stroke="url(#np-violet)"/>
    <!-- highlighted recipient: a routed warning landing -->
    <circle cx="198" cy="62"  r="17" stroke="url(#np-orange)"/>
  </g>

  <!-- central coordination hub: purple ring + inner disc + core -->
  <circle cx="128" cy="124" r="38" fill="url(#np-hub)"/>
  <circle cx="128" cy="124" r="29" fill="#ffffff"/>
  <circle cx="128" cy="124" r="24" fill="url(#np-hub)"/>
  <circle cx="128" cy="124" r="8"  fill="#ffffff"/>
</svg>
